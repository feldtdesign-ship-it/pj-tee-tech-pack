<!doctype html><meta charset="utf-8">
<!-- Link preview card, 1200x630. build.py fills __SIG__ and screenshots it to dist/og-card.png -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=IBM+Plex+Mono:wght@500&display=block">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#121212;color:#fff;border-bottom:14px solid #F2C200;padding:64px 72px 0;display:grid;grid-template-columns:1fr auto;grid-template-rows:1fr auto;column-gap:40px}
img{grid-column:1/-1;height:230px;width:auto;align-self:start}
h1{font:700 110px/.9 Oswald,Impact,sans-serif;text-transform:uppercase;letter-spacing:-.005em;white-space:nowrap}
h1 span{color:#F2C200}
.beta{display:inline-block;font:500 22px/1 "IBM Plex Mono",monospace;letter-spacing:.2em;background:#F2C200;color:#121212;padding:9px 12px 7px;vertical-align:44px;margin-left:18px}
p{font:500 17px/1.6 "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:#bdbdbd;text-align:right;align-self:end;padding-bottom:6px}
.row{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:48px}
</style>
<img src="__SIG__" alt="">
<div class="row">
  <h1>Tee <span>Tech Pack</span> 2.0<em class="beta">BETA</em></h1>
</div>
